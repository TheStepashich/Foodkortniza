<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Картошка фри — логотип Фудкортницы">
  <title>Картошка фри — Фудкортница</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB347"/>
      <stop offset="0.55" stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#EF5123"/>
    </linearGradient>
    <radialGradient id="glow" cx="54" cy="48" r="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF3E0" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFF3E0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fryLight" x1="50" y1="22" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE082"/>
      <stop offset="0.55" stop-color="#FFCA28"/>
      <stop offset="1" stop-color="#FFA000"/>
    </linearGradient>
    <linearGradient id="fryMid" x1="50" y1="24" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD54F"/>
      <stop offset="0.55" stop-color="#FFB300"/>
      <stop offset="1" stop-color="#F57C00"/>
    </linearGradient>
    <linearGradient id="fryDeep" x1="50" y1="22" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC107"/>
      <stop offset="0.55" stop-color="#FFA000"/>
      <stop offset="1" stop-color="#EF6C00"/>
    </linearGradient>
    <linearGradient id="carton" x1="39" y1="56" x2="69" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF5252"/>
      <stop offset="0.5" stop-color="#E53935"/>
      <stop offset="1" stop-color="#C62828"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#7F1D00" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g transform="scale(4.7407407407)">
    <!-- Фон -->
    <rect x="0" y="0" width="108" height="108" rx="26" fill="url(#bg)"/>
    <circle cx="54" cy="48" r="44" fill="url(#glow)"/>

    <!-- Блики вокруг -->
    <path d="M82,26 L83.3,28.7 L86,30 L83.3,31.3 L82,34 L80.7,31.3 L78,30 L80.7,28.7 Z" fill="#FFF8E1" opacity="0.85"/>
    <path d="M25,40 L26,42 L28,43 L26,44 L25,46 L24,44 L22,43 L24,42 Z" fill="#FFF8E1" opacity="0.7"/>

    <!-- Картофель фри: веер из шести полосок -->
    <g filter="url(#softShadow)">
      <g transform="rotate(-30 54 58)">
        <path d="M51,58 L51,36.5 C51,33.2 52.3,31 54,31 C55.7,31 57,33.2 57,36.5 L57,58 Z" fill="url(#fryMid)"/>
        <path d="M52.6,54 L52.6,37 C52.6,34.5 53.2,33 54,32.6" fill="none" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" opacity="0.55"/>
      </g>
      <g transform="rotate(30 54 58)">
        <path d="M51,58 L51,37.5 C51,34.2 52.3,32 54,32 C55.7,32 57,34.2 57,37.5 L57,58 Z" fill="url(#fryLight)"/>
        <path d="M52.6,54 L52.6,38 C52.6,35.5 53.2,34 54,33.6" fill="none" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" opacity="0.55"/>
      </g>
      <g transform="rotate(-18 54 58)">
        <path d="M51,58 L51,32.5 C51,29.2 52.3,27 54,27 C55.7,27 57,29.2 57,32.5 L57,58 Z" fill="url(#fryLight)"/>
        <path d="M52.6,54 L52.6,33 C52.6,30.5 53.2,29 54,28.6" fill="none" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" opacity="0.55"/>
      </g>
      <g transform="rotate(18 54 58)">
        <path d="M51,58 L51,33 C51,29.7 52.3,27.5 54,27.5 C55.7,27.5 57,29.7 57,33 L57,58 Z" fill="url(#fryMid)"/>
        <path d="M52.6,54 L52.6,33.5 C52.6,31 53.2,29.5 54,29.1" fill="none" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" opacity="0.55"/>
      </g>
      <g transform="rotate(-6 54 58)">
        <path d="M51,58 L51,29 C51,25.7 52.3,23.5 54,23.5 C55.7,23.5 57,25.7 57,29 L57,58 Z" fill="url(#fryDeep)"/>
        <path d="M52.6,54 L52.6,29.5 C52.6,27 53.2,25.5 54,25.1" fill="none" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" opacity="0.55"/>
      </g>
      <g transform="rotate(6 54 58)">
        <path d="M51,58 L51,30 C51,26.7 52.3,24.5 54,24.5 C55.7,24.5 57,26.7 57,30 L57,58 Z" fill="url(#fryLight)"/>
        <path d="M52.6,54 L52.6,30.5 C52.6,28 53.2,26.5 54,26.1" fill="none" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" opacity="0.55"/>
      </g>
    </g>

    <!-- Красный стаканчик -->
    <g filter="url(#softShadow)">
      <path d="M36,53 L72,53 L68,80 Q67.6,83 64.5,83 L43.5,83 Q40.4,83 40,80 Z" fill="#B71C1C"/>
      <path d="M39.5,56 L68.5,56 L64.8,78 Q64.4,80.5 62,80.5 L46,80.5 Q43.6,80.5 43.2,78 Z" fill="url(#carton)"/>
      <path d="M39.5,56 L44.5,56 L47,80.5 L43.2,78 Q43.6,80.5 46,80.5 Z" fill="#FF8A80" opacity="0.28"/>
      <path d="M37.5,56 Q37.5,51.5 42,51.5 L66,51.5 Q70.5,51.5 70.5,56 L70.5,59 L37.5,59 Z" fill="#FFF8E1"/>
      <path d="M38,58.4 L70,58.4" fill="none" stroke="#E65100" stroke-width="0.9" opacity="0.25"/>
    </g>

    <!-- Улыбающаяся картошка -->
    <circle cx="45" cy="69.5" r="2" fill="#FF8A80" opacity="0.85"/>
    <circle cx="63" cy="69.5" r="2" fill="#FF8A80" opacity="0.85"/>
    <circle cx="49" cy="65.5" r="2.1" fill="#5D1608"/>
    <circle cx="59" cy="65.5" r="2.1" fill="#5D1608"/>
    <path d="M49.5,71 Q54,75.5 58.5,71" fill="none" stroke="#5D1608" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
